name: Build Installers

# 触发方式:
#   1. 手动: Actions 页面 → Build Installers → Run workflow(可填版本号)
#   2. 自动: 推送 v* 标签(如 git tag v1.0.0 && git push --tags)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号(如 v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS exe + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Generate updater metadata (windows)
        shell: bash
        run: |
          set -e
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          EXE=$(ls src-tauri/target/release/bundle/nsis/LenTalk_${VERSION_NUM}_*-setup.exe | head -1)
          EXE_NAME=$(basename "$EXE")
          SIG=$(cat "${EXE}.sig")
          cat > latest-windows.json <<EOF
          {
            "version": "$VERSION_NUM",
            "notes": "LenTalk $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/jownda/LenTalk-Copilot/releases/download/$VERSION/$EXE_NAME"
              }
            }
          }
          EOF

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          name: LenTalk ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/wix/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            latest-windows.json

  build-macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # 只打 .app(tauri 自带 dmg 脚本有 bug),dmg 用 hdiutil 手动打
      - name: Build macOS app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app

      - name: Package dmg
        run: |
          set -e
          mkdir -p dmg-staging
          cp -R src-tauri/target/release/bundle/macos/LenTalk.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          hdiutil create -volname LenTalk -srcfolder dmg-staging -ov -format UDZO \
            -imagekey zlib-level=9 "LenTalk_${VERSION_NUM}_aarch64.dmg"

      - name: Generate updater metadata (macos)
        run: |
          set -e
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          SIG=$(cat src-tauri/target/release/bundle/macos/LenTalk.app.tar.gz.sig)
          cat > latest-macos.json <<EOF
          {
            "version": "$VERSION_NUM",
            "notes": "LenTalk $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG",
                "url": "https://github.com/jownda/LenTalk-Copilot/releases/download/$VERSION/LenTalk.app.tar.gz"
              }
            }
          }
          EOF

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          name: LenTalk ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            LenTalk_*_aarch64.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            latest-macos.json
