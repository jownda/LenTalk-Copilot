name: Build Installers

# 触发方式:
#   1. 手动: Actions 页面 → Build Installers → Run workflow(可填版本号)
#   2. 自动: 推送 v* 标签(如 git tag v1.0.0 && git push --tags)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号(如 v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS exe + MSI)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # ── OTA 分发基址(仓库 Settings → Variables 配置) ──────────────────
      # 留空   → 回落 github 镜像转发(ghfast.top), 即当前默认行为
      # 轻量云 → 填服务器地址, 如 https://update.example.com 或 http://1.2.3.4:8080
      # 对象存储 → 到期后只把这个变量改成 COS 域名, 无需再动工作流
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
      # 自建源回传(全空则整步自动跳过, 不影响 github 镜像链路)
      OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
      OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
      OTA_SSH_KEY: ${{ secrets.OTA_SSH_KEY }}
      OTA_SSH_PORT: ${{ vars.OTA_SSH_PORT }}
      # 必须与服务器上 nginx alias 的目录一致(见 deploy/ota-source/nginx-ota.conf)。
      # 给默认值是为了防漏填: 若为空, 文件会被写到 SSH 用户的根目录/家目录, 而 nginx
      # 从 /var/www/lentalk-ota 读取 → 表现为"CI 全绿但客户端永远查不到更新"这种静默失败。
      OTA_REMOTE_DIR: ${{ vars.OTA_REMOTE_DIR || '/var/www/lentalk-ota' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # 随包 ffmpeg(视频 VFR→CFR 归一化用):压缩包放在 bundled-tools Release 资产上,
      # 构建前还原到 src-tauri/resources/bin/。主配置不含 resources, 只有
      # tauri.windows.conf.json 引用它, 因此 macOS job 不需要这一步。
      - name: Restore bundled ffmpeg
        run: npm run setup:ffmpeg

      - name: Clean stale bundle artifacts
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Windows installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Generate updater metadata (windows)
        id: meta
        shell: bash
        run: |
          set -e
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          EXE=$(ls src-tauri/target/release/bundle/nsis/LenTalk_${VERSION_NUM}_*-setup.exe | head -1)
          EXE_NAME=$(basename "$EXE")
          SIG=$(cat "${EXE}.sig")
          # 资源下载基址: 自建源(轻量云/COS) → <基址>/releases/<tag>; 未配置 → github 镜像前缀转发
          if [ -n "$UPDATE_BASE_URL" ]; then
            ASSET_BASE="${UPDATE_BASE_URL%/}/releases/$VERSION"
          else
            ASSET_BASE="https://ghfast.top/https://github.com/jownda/LenTalk-Copilot/releases/download/$VERSION"
          fi
          cat > latest-windows.json <<EOF
          {
            "version": "$VERSION_NUM",
            "notes": "LenTalk $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64-nsis": {
                "signature": "$SIG",
                "url": "${ASSET_BASE}/${EXE_NAME}"
              },
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "${ASSET_BASE}/${EXE_NAME}"
              }
            }
          }
          EOF
          echo "资源基址: ${ASSET_BASE}/${EXE_NAME}"
          echo "exe_path=$EXE" >> "$GITHUB_OUTPUT"
          echo "asset_base=$ASSET_BASE" >> "$GITHUB_OUTPUT"

      - name: Publish updater files to self-hosted source
        if: env.UPDATE_BASE_URL != '' && env.OTA_SSH_HOST != ''
        shell: bash
        run: |
          set -e
          # 自建源"配了一半"比完全不配更危险: 缺 OTA_SSH_USER 会拼出 "@1.2.3.4" 这种非法
          # 地址, 缺 OTA_SSH_KEY 会让 ssh 退化成交互式认证(CI 中必然挂起)。
          # 这里统一拦下并给出可操作的报错, 而不是让它以一个难懂的 ssh 报错收场。
          if [ -z "$OTA_SSH_USER" ] || [ -z "$OTA_SSH_KEY" ]; then
            echo "::error::自建源已启用(UPDATE_BASE_URL / OTA_SSH_HOST 非空), 但 OTA_SSH_USER 或 OTA_SSH_KEY 未配置"
            exit 1
          fi
          case "$OTA_REMOTE_DIR" in
            /*) ;;
            *) echo "::error::OTA_REMOTE_DIR 必须是绝对路径, 当前为 '$OTA_REMOTE_DIR'"; exit 1 ;;
          esac
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          PORT="${OTA_SSH_PORT:-22}"
          REMOTE="$OTA_SSH_USER@$OTA_SSH_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$OTA_SSH_KEY" > ~/.ssh/ota_key
          chmod 600 ~/.ssh/ota_key
          ssh -i ~/.ssh/ota_key -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$REMOTE" "mkdir -p '$OTA_REMOTE_DIR/releases/$VERSION'"
          scp -i ~/.ssh/ota_key -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.meta.outputs.exe_path }}" \
            "${{ steps.meta.outputs.exe_path }}.sig" \
            latest-windows.json \
            "$REMOTE:$OTA_REMOTE_DIR/releases/$VERSION/"
          # 顶层清单始终指向"最新", 客户端端点固定读取该路径
          ssh -i ~/.ssh/ota_key -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$REMOTE" "cp '$OTA_REMOTE_DIR/releases/$VERSION/latest-windows.json' '$OTA_REMOTE_DIR/latest-windows.json'"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.5.1
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          name: LenTalk ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            latest-windows.json

  build-macos:
    name: macOS (dmg)
    runs-on: macos-latest
    env:
      # 与 build-windows 同一组变量, 两个平台的清单基址始终一致
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
      OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
      OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
      OTA_SSH_KEY: ${{ secrets.OTA_SSH_KEY }}
      OTA_SSH_PORT: ${{ vars.OTA_SSH_PORT }}
      # 同上: 默认值与 nginx alias 目录保持一致, 防止漏填导致静默失败
      OTA_REMOTE_DIR: ${{ vars.OTA_REMOTE_DIR || '/var/www/lentalk-ota' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Clean stale bundle artifacts
        run: rm -rf src-tauri/target/release/bundle

      # 只打 .app(tauri 自带 dmg 脚本有 bug),dmg 用 hdiutil 手动打
      - name: Build macOS app bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles app

      - name: Package dmg
        run: |
          set -e
          mkdir -p dmg-staging
          cp -R src-tauri/target/release/bundle/macos/LenTalk.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          hdiutil create -volname LenTalk -srcfolder dmg-staging -ov -format UDZO \
            -imagekey zlib-level=9 "LenTalk_${VERSION_NUM}_aarch64.dmg"

      - name: Generate updater metadata (macos)
        id: meta
        run: |
          set -e
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          SIG=$(cat src-tauri/target/release/bundle/macos/LenTalk.app.tar.gz.sig)
          # 与 Windows 同一套基址规则
          if [ -n "$UPDATE_BASE_URL" ]; then
            ASSET_BASE="${UPDATE_BASE_URL%/}/releases/$VERSION"
          else
            ASSET_BASE="https://ghfast.top/https://github.com/jownda/LenTalk-Copilot/releases/download/$VERSION"
          fi
          cat > latest-darwin.json <<EOF
          {
            "version": "$VERSION_NUM",
            "notes": "LenTalk $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIG",
                "url": "${ASSET_BASE}/LenTalk.app.tar.gz"
              }
            }
          }
          EOF
          cp latest-darwin.json latest-macos.json
          echo "资源基址: ${ASSET_BASE}/LenTalk.app.tar.gz"
          echo "asset_base=$ASSET_BASE" >> "$GITHUB_OUTPUT"

      - name: Publish updater files to self-hosted source
        if: env.UPDATE_BASE_URL != '' && env.OTA_SSH_HOST != ''
        run: |
          set -e
          # 与 build-windows 同一套前置校验(两处需保持同步)
          if [ -z "$OTA_SSH_USER" ] || [ -z "$OTA_SSH_KEY" ]; then
            echo "::error::自建源已启用(UPDATE_BASE_URL / OTA_SSH_HOST 非空), 但 OTA_SSH_USER 或 OTA_SSH_KEY 未配置"
            exit 1
          fi
          case "$OTA_REMOTE_DIR" in
            /*) ;;
            *) echo "::error::OTA_REMOTE_DIR 必须是绝对路径, 当前为 '$OTA_REMOTE_DIR'"; exit 1 ;;
          esac
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          PORT="${OTA_SSH_PORT:-22}"
          REMOTE="$OTA_SSH_USER@$OTA_SSH_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$OTA_SSH_KEY" > ~/.ssh/ota_key
          chmod 600 ~/.ssh/ota_key
          ssh -i ~/.ssh/ota_key -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$REMOTE" "mkdir -p '$OTA_REMOTE_DIR/releases/$VERSION'"
          scp -i ~/.ssh/ota_key -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            latest-darwin.json \
            latest-macos.json \
            "$REMOTE:$OTA_REMOTE_DIR/releases/$VERSION/"
          scp -i ~/.ssh/ota_key -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            src-tauri/target/release/bundle/macos/LenTalk.app.tar.gz \
            src-tauri/target/release/bundle/macos/LenTalk.app.tar.gz.sig \
            "LenTalk_${VERSION#v}_aarch64.dmg" \
            "$REMOTE:$OTA_REMOTE_DIR/releases/$VERSION/"
          ssh -i ~/.ssh/ota_key -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$REMOTE" "cp '$OTA_REMOTE_DIR/releases/$VERSION/latest-darwin.json' '$OTA_REMOTE_DIR/latest-darwin.json' && cp '$OTA_REMOTE_DIR/releases/$VERSION/latest-macos.json' '$OTA_REMOTE_DIR/latest-macos.json'"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2.5.1
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          name: LenTalk ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            LenTalk_*_aarch64.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            latest-darwin.json
            latest-macos.json

  repair-legacy-updater-manifests:
    name: Merge updater manifests for older clients
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge platform metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          VERSION="${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version }}"
          mkdir -p metadata
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern latest-windows.json \
            --pattern latest-macos.json \
            --dir metadata \
            --clobber
          jq -s '.[0] as $windows | .[1] as $macos | ($windows * $macos) | .platforms = ($windows.platforms * $macos.platforms)' \
            metadata/latest-windows.json metadata/latest-macos.json > metadata/latest-combined.json
          cp metadata/latest-combined.json metadata/latest-windows.json
          cp metadata/latest-combined.json metadata/latest-macos.json
          gh release upload "$VERSION" \
            --repo "${{ github.repository }}" \
            metadata/latest-windows.json \
            metadata/latest-macos.json \
            --clobber
