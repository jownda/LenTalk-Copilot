# ── LenTalk OTA 自建更新源 · nginx 片段 ─────────────────────────────────
# 用途: 在已有的 server 块中暴露静态更新文件, 与参考图上传服务共用同一 nginx/端口。
# 安装: 复制内容到现有 server {} 内, 或见 README 的 include 方式。
# 约定:
#   客户端端点 → http(s)://<主机>/ota/latest-{{target}}.json
#   清单内 url → http(s)://<主机>/ota/releases/<tag>/<文件>
# 磁盘目录   → /var/www/lentalk-ota/{latest-*.json, releases/<tag>/...}

    # ── 更新清单: 必须实时生效, 严禁缓存 ──────────────────────────────
    # 客户端只在清单变化时才会下载新包, 缓存会导致"检查不到更新"。
    location = /ota/latest-windows.json {
        alias /var/www/lentalk-ota/latest-windows.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /ota/latest-darwin.json {
        alias /var/www/lentalk-ota/latest-darwin.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 老客户端(1.2.12 及更早)读取的是合并清单名, 需一并提供
    location = /ota/latest-macos.json {
        alias /var/www/lentalk-ota/latest-macos.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── 安装包: 按版本目录组织, 内容不可变, 可长缓存 ─────────────────
    location /ota/releases/ {
        alias /var/www/lentalk-ota/releases/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 安装包体积约 16MB(Windows) / 10MB(dmg), 关闭 gzip 省 CPU
        gzip off;
    }

    # 兜底: /ota/ 下的其他路径(含目录索引)一律 404, 避免外部枚举版本
    # 注意: 前缀匹配取最长者, 上面两条更具体的 location 仍然优先生效
    location /ota/ {
        return 404;
    }
